name: Tag cmd/jet submodule

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag-cmd-jet:
    if: "!startsWith(github.ref, 'refs/tags/cmd/jet/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/jet/go.mod
      - name: Update cmd/jet and tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          root_tag="${GITHUB_REF_NAME}"
          sub_tag="cmd/jet/${root_tag}"
          
          if git rev-parse -q --verify "refs/tags/${sub_tag}"; then
            echo "Tag ${sub_tag} already exists. Skipping."
            exit 0
          fi
          
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          
          pushd cmd/jet
          go mod edit -require="github.com/goranbjelanovic/jet/v2@${root_tag}"
          go mod tidy
          popd
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add cmd/jet/go.mod cmd/jet/go.sum
            git commit -m "chore(cmd/jet): bump jet to ${root_tag}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "No cmd/jet module changes to commit."
          fi
          
          git tag "${sub_tag}" "HEAD"
          git push origin "${sub_tag}"
